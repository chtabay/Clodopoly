<?xml version="1.0" encoding="UTF-8"?>
<svg width="250" height="350" xmlns="http://www.w3.org/2000/svg">
    <!-- Fond de carte -->
    <rect x="10" y="10" width="230" height="330" rx="15" 
          fill="#ffebee" stroke="#c62828" stroke-width="2"/>
    
    <!-- En-tête -->
    <rect x="20" y="20" width="210" height="40" rx="5" 
          fill="#ef5350"/>
    <text x="40" y="47" font-family="Arial" font-size="24" fill="white">CHANCE</text>
    <text x="190" y="47" font-family="Arial" font-size="24" fill="white">⚡</text>
    
    <!-- Zone illustration -->
    <rect x="30" y="70" width="190" height="140" rx="5" 
          fill="white" stroke="#c62828" stroke-width="1"/>
    <text x="125" y="150" font-family="Arial" font-size="48" 
          text-anchor="middle" fill="#c62828">👊</text>
    
    <!-- Nom de l'événement -->
    <rect x="20" y="220" width="210" height="40" rx="5" 
          fill="#ef5350"/>
    <text x="125" y="247" font-family="Arial" font-size="18" 
          text-anchor="middle" fill="white">AGRESSION</text>
    
    <!-- Zone effet -->
    <rect x="30" y="270" width="190" height="60" rx="5" 
          fill="white" stroke="#c62828" stroke-width="1"/>
    <text x="40" y="290" font-family="Arial" font-size="14" 
          fill="#c62828">Effet immédiat:</text>
    <text x="40" y="310" font-family="Arial" font-size="12" 
          fill="#c62828">-1 PV et perte d'un objet</text>
</svg> 